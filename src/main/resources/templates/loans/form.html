<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuovo prestito</title>
</head>
<body>

<h1>Nuovo prestito</h1>

<div th:if="${errorMessage}">
    <p th:text="${errorMessage}" style="color: red;"></p>
</div>

<p th:if="${book != null}">
    Libro:
    <strong th:text="${book.title}"></strong>
</p>

<form th:if="${book != null}"
      th:action="@{/books/{bookId}/loans(bookId=${book.id})}"
      th:object="${loan}"
      method="post">

    <div th:if="${#fields.hasGlobalErrors()}">
        <p th:each="error : ${#fields.globalErrors()}"
           th:text="${error}"
           style="color: red;">
        </p>
    </div>

    <div>
        <label for="endDate">Data di scadenza:</label>

        <input id="endDate"
               type="date"
               th:field="*{endDate}"/>

        <p th:if="${#fields.hasErrors('endDate')}"
           th:errors="*{endDate}"
           style="color: red;">
        </p>
    </div>

    <br>

    <button type="submit">
        Conferma prestito
    </button>

</form>

<p>
    <a th:if="${book != null}"
       th:href="@{/books/{id}(id=${book.id})}">
        Torna al libro
    </a>
</p>

</body>
</html>
