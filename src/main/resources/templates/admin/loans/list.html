<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Prestiti</title>
</head>
<body>

<h1>Prestiti</h1>

<a href="/">Home</a>

<hr>

<h2>Prestiti attivi</h2>

<div th:if="${activeLoans == null or activeLoans.isEmpty()}">
    <p>Nessun prestito attivo.</p>
</div>

<table border="1" th:if="${activeLoans != null and !activeLoans.isEmpty()}">
    <thead>
    <tr>
        <th>Libro</th>
        <th>Data inizio</th>
        <th>Data scadenza</th>
        <th>Azione</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="loan : ${activeLoans}">
        <td th:text="${loan.book.title}"></td>
        <td th:text="${loan.startDate}"></td>
        <td th:text="${loan.endDate}"></td>
        <td>
            <form th:action="@{'/loans/' + ${loan.id} + '/return'}"
                  method="post">
                <button type="submit">Segna restituito</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<hr>

<h2>Storico prestiti</h2>

<div th:if="${returnedLoans == null or returnedLoans.isEmpty()}">
    <p>Nessun prestito restituito.</p>
</div>

<table border="1" th:if="${returnedLoans != null and !returnedLoans.isEmpty()}">
    <thead>
    <tr>
        <th>Libro</th>
        <th>Data inizio</th>
        <th>Data scadenza</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="loan : ${returnedLoans}">
        <td th:text="${loan.book.title}"></td>
        <td th:text="${loan.startDate}"></td>
        <td th:text="${loan.endDate}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
