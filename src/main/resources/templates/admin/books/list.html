<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestione libri</title>
</head>
<body>

<div style="text-align: right; margin-bottom: 20px;">
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</div>

<h1>Gestione libri</h1>

<div th:if="${errorMessage}">
    <p th:text="${errorMessage}"
       style="color: red; font-weight: bold;">
    </p>
</div>

<div th:if="${successMessage}">
    <p th:text="${successMessage}"
       style="color: green; font-weight: bold;">
    </p>
</div>

<p>
    <a th:href="@{/admin}">Pagina amministrativa</a>
    |
    <a th:href="@{/admin/books/new}">➕ Aggiungi libro</a>
</p>

<div th:if="${books == null || books.isEmpty()}">
    <p>Non ci sono libri presenti.</p>
</div>

<table border="1"
       th:if="${books != null && !books.isEmpty()}">

    <thead>
    <tr>
        <th>Immagine</th>
        <th>Titolo</th>
        <th>Autore</th>
        <th>Anno</th>
        <th>Azioni</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="book : ${books}">

        <td>
            <img th:if="${book.urlImage != null && !book.urlImage.isEmpty()}"
                 th:src="${book.urlImage}"
                 alt="Copertina"
                 width="60"
                 height="90"/>

            <span th:if="${book.urlImage == null || book.urlImage.isEmpty()}">
                Nessuna immagine
            </span>
        </td>

        <td th:text="${book.title}"></td>

        <td>
            <a th:if="${book.author != null}"
               th:href="@{/authors/{id}(id=${book.author.id})}"
               th:text="${book.author.name + ' ' + book.author.surname}">
            </a>

            <span th:if="${book.author == null}">
                Nessun autore
            </span>
        </td>

        <td th:text="${book.year}"></td>

        <td>
            <a th:href="@{/admin/books/{id}(id=${book.id})}">
                Dettagli
            </a>

            |

            <a th:href="@{/admin/books/{id}/edit(id=${book.id})}">
                Modifica
            </a>

            |

            <form th:action="@{/admin/books/{id}/delete(id=${book.id})}"
                  method="post"
                  style="display: inline;">

                <button type="submit">
                    Elimina
                </button>
            </form>
        </td>

    </tr>
    </tbody>

</table>

</body>
</html>
