<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dettaglio libro</title>
</head>
<body>

<div style="text-align: right; margin-bottom: 20px;">
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</div>

<h1>Dettaglio libro</h1>

<div th:if="${book}">

    <div>
        <img th:if="${book.urlImage != null && !book.urlImage.isEmpty()}"
             th:src="${book.urlImage}"
             alt="Copertina"
             width="120"
             height="180"/>
    </div>

    <p>
        <strong>Titolo:</strong>
        <span th:text="${book.title}"></span>
    </p>

    <p>
        <strong>Anno:</strong>
        <span th:text="${book.year}"></span>
    </p>

    <p>
        <strong>Autore:</strong>

        <a th:if="${book.author != null}"
           th:href="@{/admin/authors/{id}(id=${book.author.id})}"
           th:text="${book.author.name + ' ' + book.author.surname}">
        </a>

        <span th:if="${book.author == null}">
            Nessun autore associato
        </span>
    </p>

    <hr>

    <h2>Stato prestito</h2>

    <p th:if="${bookAlreadyLoaned}" style="color: red;">
        Il libro è attualmente in prestito.
    </p>

    <p th:unless="${bookAlreadyLoaned}" style="color: green;">
        Il libro è attualmente disponibile.
    </p>

    <hr>

    <h2>Recensioni</h2>

    <div th:if="${book.reviews == null || book.reviews.isEmpty()}">
        <p>Nessuna recensione presente.</p>
    </div>

    <ul th:if="${book.reviews != null && !book.reviews.isEmpty()}">
        <li th:each="review : ${book.reviews}">
            <p th:text="${review.text}"></p>

            <small th:if="${review.creationDate}"
                   th:text="${review.creationDate}">
            </small>
        </li>
    </ul>

    <hr>

    <p>
        <a th:href="@{/admin/books/{id}/edit(id=${book.id})}">
            Modifica libro
        </a>
    </p>

    <p>
        <a th:href="@{/admin/books}">
            Torna alla gestione libri
        </a>
    </p>

    <p>
        <a th:href="@{/admin}">
            Home amministrativa
        </a>
    </p>

</div>

</body>
</html>
