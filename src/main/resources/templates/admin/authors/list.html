<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestione autori</title>
</head>
<body>

<div style="text-align: right; margin-bottom: 20px;">
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</div>

<h1>Gestione autori</h1>

<div th:if="${errorMessage}">
    <p th:text="${errorMessage}"
       style="color: red; font-weight: bold;">
    </p>
</div>

<div th:if="${successMessage}">
    <p th:text="${successMessage}"
       style="color: green; font-weight: bold;">
    </p>
</div>

<p>
    <a th:href="@{/admin}">Pagina amministrativa</a>
    |
    <a th:href="@{/admin/authors/new}">Aggiungi autore</a>
</p>

<div th:if="${authors == null || authors.isEmpty()}">
    <p>Non ci sono autori presenti.</p>
</div>

<table border="1"
       th:if="${authors != null && !authors.isEmpty()}">

    <thead>
    <tr>
        <th>Nome</th>
        <th>Cognome</th>
        <th>Data di nascita</th>
        <th>Azioni</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="author : ${authors}">

        <td th:text="${author.name}"></td>

        <td th:text="${author.surname}"></td>

        <td th:text="${author.birthDate}"></td>

        <td>
            <a th:href="@{/admin/authors/{id}(id=${author.id})}">
                Dettagli
            </a>

            |

            <a th:href="@{/admin/authors/{id}/edit(id=${author.id})}">
                Modifica
            </a>

            |

            <form th:action="@{/admin/authors/{id}/delete(id=${author.id})}"
                  method="post"
                  style="display: inline;">

                <button type="submit">
                    Elimina
                </button>
            </form>
        </td>

    </tr>
    </tbody>

</table>

</body>
</html>
