<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Dettaglio Autore</title>
</head>
<body>

<h1>Dettaglio Autore</h1>

<div style="text-align: right; margin-bottom: 20px;">

    <div sec:authorize="isAnonymous()">
        <a th:href="@{/register}">Registrati</a>
        |
        <a th:href="@{/login}">Login</a>
    </div>

    <div sec:authorize="isAuthenticated()">
        <span>
            Utente:
            <strong sec:authentication="name"></strong>
        </span>

        <form th:action="@{/logout}"
              method="post"
              style="display: inline; margin-left: 10px;">
            <button type="submit">Logout</button>
        </form>
    </div>

</div>

<p><b>Nome:</b> <span th:text="${author.name}"></span></p>
<p><b>Cognome:</b> <span th:text="${author.surname}"></span></p>
<p><b>Data di nascita:</b> <span th:text="${author.birthDate}"></span></p>

<h2>Libri scritti</h2>

<div th:if="${author.books == null or author.books.isEmpty()}">
    <p>Nessun libro associato a questo autore.</p>
</div>

<ul th:if="${author.books != null and !author.books.isEmpty()}">
    <li th:each="book : ${author.books}">
        <a th:href="@{'/books/' + ${book.id}}" th:text="${book.title}"></a>
        <span th:text="'(' + ${book.year} + ')'"></span>
    </li>
</ul>

<br>

<a href="/authors">Torna alla lista autori</a>

</body>
</html>
