<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dettaglio Libro</title>
</head>
<body>

<h1>Dettaglio Libro</h1>

<div>
    <img th:src="${book.urlImage}" width="120" height="180"/>
</div>

<p><b>Titolo:</b> <span th:text="${book.title}"></span></p>

<p><b>Anno:</b> <span th:text="${book.year}"></span></p>

<br>

<a th:href="@{'/books/' + ${book.id} + '/reviews/new'}">
    Scrivi recensione
</a>

<br>

<a href="/books">⬅ Torna alla lista</a>

</body>
</html>
