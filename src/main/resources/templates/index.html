<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Biblioteca SIW</title>
</head>

<body>

<header style="display: flex;
               justify-content: space-between;
               align-items: center;
               margin-bottom: 20px;">

    <h1>📚 Biblioteca SIW</h1>

    <div>
        <div sec:authorize="isAnonymous()">
            <a th:href="@{/register}">Registrati</a>
            |
            <a th:href="@{/login}">Login</a>
        </div>

        <div sec:authorize="isAuthenticated()">
            <span>
                Benvenuto,
                <strong sec:authentication="name"></strong>
            </span>

            <form th:action="@{/logout}"
                  method="post"
                  style="display: inline; margin-left: 10px;">
                <button type="submit">Logout</button>
            </form>
        </div>
    </div>

</header>

<hr>

<nav>
    <ul>
        <li>
			📚
            <a th:href="@{/books}">Lista libri</a>
        </li>

        <li>
			✍️
            <a th:href="@{/authors}">Lista autori</a>
        </li>

        <li sec:authorize="isAuthenticated() and !hasRole('ADMIN')">
			📦
            <a th:href="@{/loans/my}">I tuoi prestiti</a>
        </li>
<br>
        <li>
			⚙️
            <a th:href="@{/admin}">Area amministrativa</a>
        </li>
    </ul>
</nav>

<hr>

<footer>
    <p>Progetto SIW - Biblioteca</p>
</footer>

</body>
</html>
